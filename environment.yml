name: mcpfolio
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - nodejs=22
  - pip
  - pip:
    # LangChain & LangGraph ecosystem
    - langgraph==1.0.8
    - langgraph-checkpoint==4.0.0
    - langgraph-prebuilt==1.0.7
    - langchain-core==1.2.13
    - langchain-ollama==1.0.1
    - langchain-mcp-adapters==0.2.1

    # MCP (Model Context Protocol)
    - mcp==1.26.0
    - fastmcp==2.14.4

    # Financial data
    - yfinance==1.1.0
    - pandas==3.0.0

    # Logging
    - structlog==25.5.0
    - python-json-logger==4.0.0

    # Configuration
    - pydantic-settings==2.13.0
    - python-dotenv==1.2.1

    # Web UI
    - fastapi==0.129.0
    - uvicorn==0.40.0
    - websockets==16.0

    # CLI Enhancement
    - rich==14.3.2
    - typer==0.23.1

    # Security & Robustness
    - cryptography==46.0.5
    - tenacity==9.1.4
    - cachetools==5.5.2

    # HTTP Client
    - httpx==0.28.1

    # Keep AnyIO in this environment and pin the fakeredis API expected by pydocket 0.16.6.
    - anyio==4.11.0
    - fakeredis==2.38.0

name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Check for updates
        id: check
        run: |
          pip-compile --upgrade pyproject.toml --output-file requirements.new.txt
          if ! diff -q requirements.txt requirements.new.txt; then
            echo "updates_available=true" >> $GITHUB_OUTPUT
          else
            echo "updates_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check.outputs.updates_available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies"
          title: "chore(deps): Weekly dependency updates"
          body: |
            Automated dependency update PR.

            Please review changes carefully before merging.

            ## Changes
            Updated dependencies to latest compatible versions.

            ## Testing
            - [ ] All tests pass
            - [ ] Manual testing completed
            - [ ] Breaking changes reviewed
          branch: deps/auto-update
          delete-branch: true
          labels: dependencies,automated
